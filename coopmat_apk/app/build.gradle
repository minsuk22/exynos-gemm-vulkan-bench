plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minsuk.coopmatprobe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minsuk.coopmatprobe'
        minSdk 28
        targetSdk 34
        versionCode 4
        versionName '1.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // r28: its Vulkan header (1.3.275) has the VK_KHR_cooperative_matrix types.
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly.
            signingConfig signingConfigs.debug
        }
    }
}
